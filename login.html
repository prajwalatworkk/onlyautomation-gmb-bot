<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login — onlyautomation.in</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0062F9">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/assets/site.css">
<style>
  body { min-height: 100vh; display: flex; flex-direction: column; background:
    radial-gradient(900px 480px at 80% -10%, rgba(30,155,255,.18), transparent 65%),
    radial-gradient(700px 420px at -5% 100%, rgba(0,98,249,.10), transparent 70%), #F6F9FF; }
  .login-wrap { flex: 1; display: grid; place-items: center; padding: 40px 20px; }
  .login-card { width: 100%; max-width: 420px; background: #fff; border: 1px solid var(--border); border-radius: var(--r-xl); box-shadow: var(--sh-3); padding: 40px 36px; }
  .login-logo img { height: 30px; width: auto; margin: 0 auto; }
  .login-card h1 { font-size: 26px; letter-spacing: -.03em; font-weight: 800; text-align: center; margin-top: 28px; }
  .login-card .sub { text-align: center; color: var(--ink-2); margin-top: 6px; font-size: 15.5px; }
  .field { margin-top: 28px; }
  .field label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 8px; }
  .pw-wrap { position: relative; }
  .pw-wrap input { width: 100%; height: 52px; padding: 0 52px 0 16px; border-radius: 12px; border: 1px solid var(--border-2); font: 500 16px var(--font); color: var(--ink); background: #fff; outline: none; transition: border-color .15s, box-shadow .15s; }
  .pw-wrap input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(0,98,249,.12); }
  .pw-toggle { position: absolute; right: 6px; top: 6px; width: 40px; height: 40px; border: none; background: none; border-radius: 10px; color: var(--ink-3); cursor: pointer; display: grid; place-items: center; }
  .pw-toggle:hover { color: var(--blue); background: var(--blue-50); }
  .login-card .btn { width: 100%; margin-top: 18px; }
  .msg { min-height: 22px; margin-top: 14px; font-size: 14.5px; font-weight: 600; text-align: center; }
  .msg.err { color: var(--red); }
  .msg.ok { color: var(--green); }
  .back { text-align: center; margin-top: 18px; font-size: 14.5px; }
  .back a { color: var(--ink-2); font-weight: 600; text-decoration: none; }
  .back a:hover { color: var(--blue); }
</style>
</head>
<body>
<main class="login-wrap">
  <form class="login-card" id="loginForm" novalidate>
    <a href="/" class="login-logo" aria-label="onlyautomation home"><img src="/assets/logo.png" alt="onlyautomation" width="227" height="30"></a>
    <h1>Welcome back</h1>
    <p class="sub">Log in to manage your LocalPulse businesses.</p>
    <div class="field">
      <label for="password">Password</label>
      <div class="pw-wrap">
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        <button class="pw-toggle" type="button" id="pwToggle" aria-label="Show password">
          <svg class="icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <button class="btn btn-primary btn-lg" type="submit" id="loginBtn">Log in</button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
    <p class="back"><a href="/">← Back to website</a></p>
  </form>
</main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const nextParam = params.get('next') || '';
  const next = /^\/(?!\/)[\w\-\/.]*$/.test(nextParam) ? nextParam : '/gmb-dashboard';
  const form = document.getElementById('loginForm');
  const input = document.getElementById('password');
  const btn = document.getElementById('loginBtn');
  const msg = document.getElementById('msg');
  const say = (text, cls) => { msg.textContent = text; msg.className = 'msg ' + (cls || ''); };
  if (params.get('out')) say("You've been logged out.", 'ok');

  document.getElementById('pwToggle').addEventListener('click', e => {
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    e.currentTarget.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    input.focus();
  });

  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!input.value) { say('Enter your password.', 'err'); input.focus(); return; }
    btn.disabled = true; btn.textContent = 'Logging in…'; say('');
    try {
      const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: input.value }) });
      const data = await r.json().catch(() => ({}));
      if (r.ok && data.ok) { location.replace(next); return; }
      say(r.status === 401 ? 'Wrong password. Please try again.' : (data.error || 'Could not log in. Please try again.'), 'err');
      input.select();
    } catch (err) {
      say('Could not reach the server. Check your connection.', 'err');
    }
    btn.disabled = false; btn.textContent = 'Log in';
  });
})();
</script>
</body>
</html>
